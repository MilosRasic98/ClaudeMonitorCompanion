; Claude Monitor Companion — Waveshare ESP32-S3-Touch-LCD-1.69
;
; Platform note. Two options exist and we are on the first:
;
;   1. platformio/espressif32 7.0.1  -> Arduino-ESP32 2.0.17 / IDF 4.4.7
;      Works with the system Python 3.9 on this machine. Current choice.
;
;   2. pioarduino fork 55.03.311     -> Arduino-ESP32 3.3.11 / IDF 5.5.5
;      Newer esp_lcd and LEDC APIs, but it hard-requires Python 3.10+ and this
;      machine only has 3.9 with no Homebrew/pyenv/uv to get a newer one.
;      To switch, install Python 3.10+, rebuild the PlatformIO venv, and set:
;      platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
;
; src/main.cpp compiles against both — the IDF 4.x / 5.x differences are behind
; ESP_IDF_VERSION checks.

[env:mascot]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

; 16 MB flash, 8 MB octal PSRAM. qio_opi = quad flash + octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

; Native USB on this board: no UART bridge, so logs come over USB CDC.
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Espressif USB JTAG/serial unit, VID 0x303A PID 0x1001.
; Works through a Dell dock; comment these out to fall back to auto-detect.
upload_port  = /dev/cu.usbmodem202201
monitor_port = /dev/cu.usbmodem202201
